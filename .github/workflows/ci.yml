name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: GUI/requirements*.txt
      - run: python -m pip install -r GUI/requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - shell: pwsh
        run: ./tools/build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: GUI/dist/TCallPager-1.1.0-rc.2-windows/
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
      - name: Compile without uploading
        run: |
          mkdir -p build/sketch/TCall_Pager dist/firmware
          cp TCall_Pager.ino modem.h build/sketch/TCall_Pager/
          arduino-cli compile --fqbn esp32:esp32:esp32 --board-options PSRAM=enabled,PartitionScheme=default --warnings all --output-dir dist/firmware build/sketch/TCall_Pager
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: dist/firmware/*
